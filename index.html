<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Head Ninja 💀</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; background: #1a1a2e; cursor: crosshair; touch-action: none; }
  canvas { display: block; }
  #ui {
    position: absolute; top: 20px; left: 50%;
    transform: translateX(-50%);
    color: #fff; font-family: 'Arial Black', sans-serif;
    font-size: 24px; text-shadow: 2px 2px 4px #000;
    display: flex; gap: 40px;
  }
  #ui2p {
    position: absolute; top: 15px; left: 0; width: 100%;
    display: none;
    justify-content: space-between;
    align-items: center;
    padding: 0 30px;
    font-family: 'Arial Black', sans-serif;
    font-size: 22px;
    color: #fff;
    text-shadow: 2px 2px 4px #000;
  }
  #ui2p .p1 { color: #4fc3f7; }
  #ui2p .p2 { color: #ff8a65; }
  #ui2p .timer { color: #fff; font-size: 28px; }
  #gameover {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%,-50%);
    color: #ff2222; font-family: 'Arial Black', sans-serif;
    font-size: 48px; text-shadow: 2px 2px 8px #000;
    display: none; text-align: center;
  }
  #gameover span { font-size: 20px; color: #fff; display: block; margin-top: 15px; }
  #gameover .winner { font-size: 28px; color: #ffd700; margin-top: 10px; }
  #startScreen {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: #1a1a2e;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    z-index: 100;
  }
  #startScreen h1 {
    color: #fff; font-family: 'Arial Black', sans-serif;
    font-size: 42px; margin-bottom: 30px;
    text-shadow: 2px 2px 8px #000;
    text-align: center;
  }
  .menuBtn {
    padding: 18px 36px;
    font-size: 20px; font-family: 'Arial Black', sans-serif;
    background: #e63946; color: #fff;
    border: none; border-radius: 12px;
    cursor: pointer; margin: 8px;
    transition: transform 0.2s, background 0.2s;
  }
  .menuBtn:hover { background: #ff4d5a; transform: scale(1.05); }
  .menuBtn.blue { background: #1565c0; }
  .menuBtn.blue:hover { background: #1e88e5; }

  #rotateScreen {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: #1a1a2e;
    display: none;
    flex-direction: column;
    justify-content: center; align-items: center;
    z-index: 9999;
    color: #fff;
    font-family: 'Arial Black', sans-serif;
    font-size: 24px;
    text-align: center;
  }
  #rotateScreen .icon {
    font-size: 80px;
    animation: rotateAnim 1.5s ease-in-out infinite;
    margin-bottom: 20px;
  }
  @keyframes rotateAnim {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(90deg); }
  }

  @media screen and (orientation: portrait) {
    #rotateScreen { display: flex; }
    #startScreen, canvas, #ui, #ui2p, #gameover { display: none !important; }
  }
  @media screen and (orientation: landscape) {
    #rotateScreen { display: none; }
  }
</style>
</head>
<body>

<div id="rotateScreen">
  <div class="icon">📱</div>
  <div>GIRA EL DISPOSITIVO</div>
  <div style="font-size:16px; margin-top:10px; font-weight:normal;">
    Este juego se juega en horizontal
  </div>
</div>

<div id="startScreen">
  <h1>💀 HEAD NINJA 💀</h1>
  <button class="menuBtn" id="btn1p">🎮 1 JUGADOR</button>
  <button class="menuBtn blue" id="btn2p">⚔️ 2 JUGADORES</button>
</div>

<div id="ui">
  <div>💀 <span id="score">0</span></div>
  <div>❤️ <span id="lives">3</span></div>
</div>

<div id="ui2p">
  <div class="p1">🔵 P1: <span id="score1">0</span></div>
  <div class="timer">⏱️ <span id="timer">60</span></div>
  <div class="p2">🟠 P2: <span id="score2">0</span></div>
</div>

<div id="gameover">GAME OVER<span id="goText">Pulsa para jugar otra vez</span><div class="winner" id="winnerText"></div></div>
<canvas id="c"></canvas>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let gameStarted = false;
let gameMode = 1;
let heads = [], particles = [], halves = [], stains = [], comboTexts = [], bombs = [], smokes = [];
let pendingHeads = [];
let attackQueue = 0;
let attackSide = 'L';
let scriptQueue = [];
let score = 0, lives = 3, gameOver = false, spawnTimer = 0, difficulty = 1;
let shakeTimer = 0, shakeIntensity = 0;
const GRAVITY = 0.22;
const HEAD_SIZE = 80;
const IMG_HEIGHT = 150;
const BOMB_SIZE = 150;
const MIN_SWIPE = 15;
const NEAR_INTERVAL = 12;
const ATTACK_INTERVAL = 20;
const BLOOD_COLORS = ['#880000', '#ff0000', '#cc0000'];
const STAIN_COLORS = ['#d90429', '#a4161a', '#f25c54', '#ef8a8a', '#cc0000', '#880000'];
const COMBO_COLORS = ['#ffffff', '#ffdd00', '#ff6600'];
const COMBO_TEXTS = ['¡COMBO!', '¡DOBLE COMBO!', '¡TRIPLE COMBO!'];
const SWOOSH_COOLDOWN = 400;

// Guion de la ronda 21: H=cabeza, B=bomba
const SCRIPT_SEQ = 'HHBHHHBBHHBHBHHHHBHBHHHHBBBBHHH';

let recentCuts = [];
const COMBO_WINDOW = 600;

const ROUND_CONFIG = [
  { heads: 1,  bombs: 0, aligned: false, spawn: 'seq',     spread: false, pause: true  }, // 1
  { heads: 2,  bombs: 0, aligned: false, spawn: 'together',spread: false, pause: true  }, // 2
  { heads: 3,  bombs: 0, aligned: false, spawn: 'together',spread: false, pause: false }, // 3
  { heads: 4,  bombs: 0, aligned: false, spawn: 'near',    spread: false, pause: true  }, // 4
  { heads: 0,  bombs: 1, aligned: false, spawn: 'seq',     spread: false, pause: true  }, // 5
  { heads: 0,  bombs: 2, aligned: false, spawn: 'seq',     spread: false, pause: true  }, // 6
  { heads: 4,  bombs: 0, aligned: true,  spawn: 'seq',     spread: false, pause: false }, // 7
  { heads: 5,  bombs: 1, aligned: false, spawn: 'near',    spread: false, pause: false }, // 8
  { heads: 4,  bombs: 1, aligned: false, spawn: 'near',    spread: false, pause: true  }, // 9
  { heads: 0,  bombs: 2, aligned: false, spawn: 'seq',     spread: false, pause: true  }, // 10
  { heads: 5,  bombs: 1, aligned: false, spawn: 'near',    spread: false, pause: true  }, // 11
  { heads: 6,  bombs: 0, aligned: false, spawn: 'near',    spread: false, pause: false }, // 12
  { heads: 7,  bombs: 0, aligned: false, spawn: 'near',    spread: false, pause: true  }, // 13
  { heads: 0,  bombs: 1, aligned: false, spawn: 'seq',     spread: false, pause: true  }, // 14
  { heads: 6,  bombs: 1, aligned: false, spawn: 'near',    spread: false, pause: true  }, // 15
  { heads: 3,  bombs: 1, aligned: false, spawn: 'near',    spread: false, pause: true  }, // 16
  { heads: 3,  bombs: 0, aligned: false, spawn: 'near',    spread: false, pause: true  }, // 17
  { heads: 8,  bombs: 0, aligned: false, spawn: 'near',    spread: true,  pause: false }, // 18
  { heads: 0,  bombs: 1, aligned: false, spawn: 'seq',     spread: false, pause: true  }, // 19
  { heads: 10, bombs: 0, aligned: false, spawn: 'attack',  spread: false, pause: true  }, // 20 ⚔️ (deja pausa de descanso)
  { heads: 0,  bombs: 0, aligned: false, spawn: 'script',  spread: false, pause: true  }, // 21 📜 guion
];
const CYCLE = ROUND_CONFIG.length;

let currentRound = 1;
let headsInRound = 0;
let headsSpawned = 0;
let headsCleared = 0;
let bombsInRound = 0;
let bombsSpawned = 0;
let roundPause = 0;
let speedMultiplier = 0.7;
let roundActive = false;

let score1 = 0, score2 = 0;
let timeLeft = 60;
let timerInterval = null;
let activeTouches = {};
let playerAssign = [false, false];
let trail1 = [], trail2 = [], trail1P = [];

const bombImg = new Image();
bombImg.src = 'bomba.png';

let audioCtx = null;
const buffers = { slice: null, mecha: null, explosion: null, launch: null, swoosh: null };
const fallbacks = {};
function initAudio() {
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    loadBuffer('slice', 'chaf.ogg', ['chaf.mp3']);
    loadBuffer('mecha', 'mecha.ogg', ['mecha.mp3']);
    loadBuffer('explosion', 'explosion.ogg', ['explosion.mp3']);
    loadBuffer('launch', 'lanzamiento.ogg', ['lanzamiento.mp3']);
    loadBuffer('swoosh', 'sable.ogg', ['sable.mp3']);
  } catch(e) {}
  makeFallback('slice', 'chaf.ogg', 'chaf.mp3');
  makeFallback('mecha', 'mecha.ogg', 'mecha.mp3');
  makeFallback('explosion', 'explosion.ogg', 'explosion.mp3');
  makeFallback('launch', 'lanzamiento.ogg', 'lanzamiento.mp3');
  makeFallback('swoosh', 'sable.ogg', 'sable.mp3');
}
function makeFallback(key, ogg, mp3) {
  const a = new Audio(ogg);
  a.addEventListener('error', () => { fallbacks[key] = new Audio(mp3); fallbacks[key].load(); });
  a.load();
  fallbacks[key] = a;
}
function loadBuffer(key, url, alternates) {
  fetch(url).then(r => { if (!r.ok) throw new Error(); return r.arrayBuffer(); })
    .then(d => new Promise((res, rej) => { audioCtx.decodeAudioData(d, res, rej); }))
    .then(b => { buffers[key] = b; })
    .catch(() => { if (alternates && alternates.length) loadBuffer(key, alternates[0], alternates.slice(1)); });
}
function playSound(key, vol, delay) {
  vol = vol === undefined ? 1 : vol;
  delay = delay || 0;
  if (audioCtx && buffers[key]) {
    const doPlay = () => {
      try {
        const s = audioCtx.createBufferSource();
        s.buffer = buffers[key];
        const g = audioCtx.createGain();
        g.gain.value = vol;
        s.connect(g); g.connect(audioCtx.destination);
        s.start(audioCtx.currentTime + delay);
      } catch(e) { playFallback(key, vol); }
    };
    if (audioCtx.state === 'suspended') audioCtx.resume().then(doPlay);
    else doPlay();
    return;
  }
  playFallback(key, vol);
}
function playFallback(key, vol) {
  const f = fallbacks[key];
  if (!f) return;
  try { const c = f.cloneNode(); c.volume = (vol === undefined ? 1 : vol); c.play().catch(() => {}); } catch(e) {}
}
function playSlice() { playSound('slice'); }
function playMecha() { playSound('mecha'); }
function playExplosion() { playSound('explosion'); }
function playLaunch() { playSound('launch', 0.6, Math.random() * 0.12); }

let lastSwoosh = 0;
function playSwoosh() {
  const now = performance.now();
  if (now - lastSwoosh < SWOOSH_COOLDOWN) return;
  lastSwoosh = now;
  playSound('swoosh', 0.5);
}

function lockLandscape() {
  if (screen.orientation && screen.orientation.lock)
    screen.orientation.lock('landscape').catch(() => {});
}
function goFullscreen(cb) {
  const el = document.documentElement;
  const fs = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
  if (fs) fs.call(el).then(cb).catch(cb);
  else cb();
}

document.getElementById('btn1p').addEventListener('click', () => {
  initAudio(); goFullscreen(() => { lockLandscape(); startGame(1); });
});
document.getElementById('btn2p').addEventListener('click', () => {
  initAudio(); goFullscreen(() => { lockLandscape(); startGame(2); });
});

function startGame(mode) {
  gameMode = mode;
  document.getElementById('startScreen').style.display = 'none';
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  gameStarted = true; gameOver = false;
  heads = []; particles = []; halves = []; stains = []; comboTexts = []; bombs = []; smokes = [];
  pendingHeads = []; attackQueue = 0; scriptQueue = [];
  trail1 = []; trail2 = []; trail1P = []; recentCuts = [];
  score = 0; lives = 3; difficulty = 1; spawnTimer = 0;
  score1 = 0; score2 = 0; timeLeft = 60;
  activeTouches = {}; playerAssign = [false, false]; prevMouse = null;
  currentRound = 1; speedMultiplier = 0.7;
  roundPause = 60; roundActive = false;
  setupRound();

  if (mode === 1) {
    document.getElementById('ui').style.display = 'flex';
    document.getElementById('ui2p').style.display = 'none';
  } else {
    document.getElementById('ui').style.display = 'none';
    document.getElementById('ui2p').style.display = 'flex';
    timerInterval = setInterval(() => {
      timeLeft--;
      document.getElementById('timer').textContent = timeLeft;
      if (timeLeft <= 0) endGame2P();
    }, 1000);
  }
  document.getElementById('gameover').style.display = 'none';
  updateUI();
  loop();
}

function getRoundConfig(round) { return ROUND_CONFIG[((round - 1) % CYCLE)]; }

function setupRound() {
  const config = getRoundConfig(currentRound);
  headsInRound = config.heads;
  bombsInRound = config.bombs;
  headsSpawned = 0; headsCleared = 0; bombsSpawned = 0;
  spawnTimer = 0; roundActive = true;
  pendingHeads = []; attackQueue = 0; scriptQueue = [];
  const cycle = Math.floor((currentRound - 1) / CYCLE);
  speedMultiplier = 0.7 + cycle * 0.15;

  if (config.spawn === 'script') {
    scriptQueue = SCRIPT_SEQ.split('');
    headsInRound = scriptQueue.filter(c => c === 'H').length;
    bombsInRound = scriptQueue.filter(c => c === 'B').length;
  } else if (headsInRound > 0) {
    if (config.aligned) {
      spawnAlignedHeads(headsInRound);
      headsSpawned = headsInRound;
    } else if (config.spawn === 'together') {
      spawnTogetherHeads(headsInRound);
      headsSpawned = headsInRound;
    } else if (config.spawn === 'near') {
      buildNearSlots(headsInRound, config.spread);
    } else if (config.spawn === 'attack') {
      attackQueue = headsInRound;
      attackSide = 'L';
    }
    if (bombsInRound > 0) {
      bombs.push(new Bomb());
      bombsSpawned = 1;
    }
  }
}

function buildNearSlots(count, spread) {
  pendingHeads = [];
  let xs = [];
  if (spread) {
    const margin = canvas.width * 0.1;
    const spacing = (canvas.width - margin * 2) / (count - 1);
    for (let i = 0; i < count; i++) xs.push(margin + i * spacing);
    xs.sort(() => Math.random() - 0.5);
  } else {
    for (let i = 0; i < count; i++) xs.push(Math.random() * (canvas.width * 0.7) + canvas.width * 0.15);
  }
  for (let i = 0; i < count; i++) {
    pendingHeads.push({ x: xs[i], startY: canvas.height * (0.6 + Math.random() * 0.5) });
  }
}

function releaseHead(slot) {
  const h = new Head();
  const centerX = canvas.width / 2;
  h.x = slot.x;
  h.vx = (centerX - slot.x) * 0.012 + (Math.random() - 0.5) * 1.5;
  h.y = slot.startY;
  h.vy = calcVyFrom(slot.startY, 50);
  heads.push(h);
}

function releaseAttackHead() {
  const h = new Head();
  const fromLeft = (attackSide === 'L');
  attackSide = fromLeft ? 'R' : 'L';
  const seg = canvas.width / 6;
  if (fromLeft) {
    h.x = seg * (1 + Math.random());
    h.vx = 1.5 + Math.random() * 1.5;
  } else {
    h.x = seg * (4 + Math.random());
    h.vx = -(1.5 + Math.random() * 1.5);
  }
  h.y = canvas.height + 40;
  h.vy = calcVy(50);
  heads.push(h);
}

function spawnTogetherHeads(count) {
  for (let i = 0; i < count; i++) {
    const h = new Head();
    const startY = canvas.height * (0.6 + Math.random() * 0.5);
    h.y = startY;
    h.vy = calcVyFrom(startY, 50);
    heads.push(h);
  }
}

function spawnAlignedHeads(count) {
  const margin = canvas.width * 0.15;
  const spacing = (canvas.width - margin * 2) / (count - 1);
  const centerX = canvas.width / 2;
  const targetY = canvas.height * 0.4;
  const maxDist = ((canvas.height + 40) - targetY) / (speedMultiplier * speedMultiplier);
  const dist = Math.min((canvas.height + 40) - targetY, maxDist);
  const vy = -Math.sqrt(2 * GRAVITY * dist) * speedMultiplier;
  for (let i = 0; i < count; i++) {
    const h = new Head();
    h.x = margin + i * spacing;
    h.vx = (centerX - h.x) * 0.005;
    h.vy = vy;
    h.y = canvas.height + 40;
    heads.push(h);
  }
}

function nextRound() {
  const config = getRoundConfig(currentRound);
  roundPause = config.pause ? 60 : 20;
  currentRound++;
  roundActive = false;
}

function endGame2P() {
  clearInterval(timerInterval); gameOver = true;
  let winText = '';
  if (score1 > score2) winText = '🔵 ¡JUGADOR 1 GANA!';
  else if (score2 > score1) winText = '🟠 ¡JUGADOR 2 GANA!';
  else winText = '🤝 ¡EMPATE!';
  document.getElementById('winnerText').textContent = winText;
  document.getElementById('goText').textContent = 'Pulsa para jugar otra vez';
  document.getElementById('gameover').style.display = 'block';
}

window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });
window.addEventListener('orientationchange', () => {
  setTimeout(() => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }, 300);
});

const FACES = [];
const IMAGES = [];
const imgSrcs = [
  'manuel1.png','manuel2.png','manuel3.png','manuel4.png',
  'revestido1.png','revestido2.png',
  'jordi1.png','jordi2.png','jordi3.png',
  'lopez1.png','lopez2.png','lopez3.png',
  'garcia1.png','garcia2.png','garcia3.png','garcia4.png',
  'buryua1.png','buryua2.png','buryua3.png',
  'cipres1.png','cipres2.png','cipres3.png'
];
imgSrcs.forEach(src => {
  const img = new Image(); img.src = src;
  img.onload = function() {
    const aspect = this.naturalWidth / this.naturalHeight;
    img.drawH = IMG_HEIGHT; img.drawW = IMG_HEIGHT * aspect;
  };
  IMAGES.push(img);
});

function randomFace() {
  const total = FACES.length + IMAGES.length;
  const idx = Math.floor(Math.random() * total);
  if (idx < FACES.length) return { type:'emoji', value:FACES[idx] };
  return { type:'image', value:IMAGES[idx - FACES.length] };
}

let prevMouse = null;

function calcVy(minY) {
  const targetY = Math.max(minY, canvas.height * (0.1 + Math.random() * 0.3));
  let dist = (canvas.height + 40) - targetY;
  const maxDist = ((canvas.height + 40) - minY) / (speedMultiplier * speedMultiplier);
  dist = Math.min(dist, maxDist);
  return -Math.sqrt(2 * GRAVITY * dist) * speedMultiplier;
}
function calcVyFrom(startY, minY) {
  const targetY = Math.max(minY, canvas.height * (0.1 + Math.random() * 0.3));
  let dist = startY - targetY;
  if (dist < 0) dist = 0;
  const maxDist = (startY - minY) / (speedMultiplier * speedMultiplier);
  dist = Math.min(dist, maxDist);
  return -Math.sqrt(2 * GRAVITY * dist) * speedMultiplier;
}

function registerCut(x, y, player) {
  const now = Date.now();
  recentCuts.push({ time: now, x, y, player });
  recentCuts = recentCuts.filter(c => now - c.time < COMBO_WINDOW);
  const playerCuts = recentCuts.filter(c => c.player === player);
  const count = playerCuts.length;
  if (count >= 2) {
    const comboIdx = Math.min(count - 2, COMBO_TEXTS.length - 1);
    const lastCut = playerCuts[playerCuts.length - 1];
    comboTexts.push(new ComboText(lastCut.x, lastCut.y - 40, COMBO_TEXTS[comboIdx], COMBO_COLORS[comboIdx]));
    const bonus = count * 5;
    if (gameMode === 1) score += bonus;
    else if (player === 1) score1 += bonus;
    else if (player === 2) score2 += bonus;
    updateUI();
    recentCuts = recentCuts.filter(c => c.player !== player);
  }
}

class ComboText {
  constructor(x, y, text, color) {
    this.x = x; this.y = y; this.text = text; this.color = color;
    this.life = 50; this.maxLife = 50; this.scale = 0;
  }
  update() {
    this.life--;
    if (this.scale < 1) this.scale += 0.15;
    if (this.scale > 1) this.scale = 1;
    return this.life > 0;
  }
  draw() {
    const alpha = Math.min(1, this.life / 20);
    const size = 40 * this.scale;
    ctx.save();
    ctx.translate(this.x, this.y - (1 - this.life/this.maxLife) * 30);
    ctx.scale(this.scale, this.scale);
    ctx.globalAlpha = alpha;
    ctx.font = 'bold ' + size + 'px Arial Black';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.strokeStyle = '#000'; ctx.lineWidth = 4;
    ctx.strokeText(this.text, 0, 0);
    ctx.fillStyle = this.color;
    ctx.fillText(this.text, 0, 0);
    ctx.restore();
    ctx.globalAlpha = 1;
  }
}

class SmokeParticle {
  constructor(x, y) {
    this.x = x; this.y = y;
    this.vx = (Math.random() - 0.5) * 0.6;
    this.vy = -0.6 - Math.random() * 0.9;
    this.r = 3 + Math.random() * 4;
    this.grow = 0.15 + Math.random() * 0.2;
    this.life = 40 + Math.random() * 20;
    this.maxLife = this.life;
    this.tone = 120 + Math.floor(Math.random() * 80);
  }
  update() {
    this.x += this.vx; this.y += this.vy;
    this.r += this.grow;
    this.vx += (Math.random() - 0.5) * 0.06;
    return --this.life > 0;
  }
  draw() {
    const t = this.life / this.maxLife;
    ctx.globalAlpha = t * 0.35;
    ctx.fillStyle = 'rgb(' + this.tone + ',' + this.tone + ',' + this.tone + ')';
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

class Stain {
  constructor(x, y) {
    this.x = x; this.y = y;
    this.life = 110; this.maxLife = 110;
    this.layers = []; this.splats = []; this.drips = [];
    const numLayers = 2 + Math.floor(Math.random() * 2);
    for (let l = 0; l < numLayers; l++) {
      const color = STAIN_COLORS[Math.floor(Math.random() * STAIN_COLORS.length)];
      const baseR = 25 + Math.random() * 30;
      const ox = (Math.random() - 0.5) * 40;
      const oy = (Math.random() - 0.5) * 40;
      const pts = [];
      const n = 8 + Math.floor(Math.random() * 5);
      for (let i = 0; i < n; i++) {
        pts.push({ angle: (Math.PI * 2 / n) * i, r: baseR * (0.5 + Math.random() * 0.8) });
      }
      this.layers.push({ color, ox, oy, pts });
      const numDrips = 1 + Math.floor(Math.random() * 3);
      for (let d = 0; d < numDrips; d++) {
        this.drips.push({
          ox: ox + (Math.random() - 0.5) * baseR,
          oy: oy + baseR * 0.3,
          len: 0,
          speed: 0.8 + Math.random() * 1.6,
          width: 3 + Math.random() * 5,
          color: color
        });
      }
    }
    const numSplats = 8 + Math.floor(Math.random() * 10);
    for (let i = 0; i < numSplats; i++) {
      this.splats.push({
        ox: (Math.random() - 0.5) * 170,
        oy: (Math.random() - 0.5) * 130,
        r: 1.5 + Math.random() * 7,
        color: STAIN_COLORS[Math.floor(Math.random() * STAIN_COLORS.length)]
      });
    }
  }
  update() {
    this.life--;
    const fadeStart = this.maxLife * 0.55;
    if (this.life < fadeStart) for (const d of this.drips) d.len += d.speed;
    return this.life > 0;
  }
  drawBlob(pts) {
    const p = pts.map(pt => ({ x: Math.cos(pt.angle) * pt.r, y: Math.sin(pt.angle) * pt.r }));
    ctx.beginPath();
    const last = p[p.length - 1];
    ctx.moveTo((p[0].x + last.x) / 2, (p[0].y + last.y) / 2);
    for (let i = 0; i < p.length; i++) {
      const curr = p[i];
      const next = p[(i + 1) % p.length];
      ctx.quadraticCurveTo(curr.x, curr.y, (curr.x + next.x) / 2, (curr.y + next.y) / 2);
    }
    ctx.closePath();
    ctx.fill();
  }
  draw() {
    const fadeStart = this.maxLife * 0.55;
    let alpha = 0.85;
    if (this.life < fadeStart) alpha = 0.85 * (this.life / fadeStart);
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.globalAlpha = alpha;
    for (const layer of this.layers) {
      ctx.save();
      ctx.translate(layer.ox, layer.oy);
      ctx.fillStyle = layer.color;
      this.drawBlob(layer.pts);
      ctx.restore();
    }
    for (const s of this.splats) {
      ctx.fillStyle = s.color;
      ctx.beginPath();
      ctx.arc(s.ox, s.oy, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
    for (const d of this.drips) {
      if (d.len <= 0) continue;
      ctx.strokeStyle = d.color;
      ctx.lineWidth = d.width;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(d.ox, d.oy);
      ctx.lineTo(d.ox, d.oy + d.len);
      ctx.stroke();
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  }
}

class Bomb {
  constructor() {
    this.x = Math.random() * (canvas.width * 0.6) + canvas.width * 0.2;
    this.y = canvas.height + 40;
    const centerX = canvas.width / 2;
    this.vx = (centerX - this.x) * 0.01 + (Math.random() - 0.5) * 1.5;
    this.vy = calcVy(60);
    this.rot = 0; this.rs = (Math.random() - 0.5) * 0.1;
    this.size = BOMB_SIZE;
    this.exploding = false; this.explodeTimer = 0;
    this.smokeTimer = 0;
    playMecha();
  }
  fuseTip() {
    const ox = -this.size * 0.15;
    const oy = -this.size * 0.42;
    const cos = Math.cos(this.rot), sin = Math.sin(this.rot);
    return { x: this.x + ox * cos - oy * sin, y: this.y + ox * sin + oy * cos };
  }
  update() {
    if (this.exploding) { this.explodeTimer--; return this.explodeTimer > 0; }
    this.x += this.vx; this.y += this.vy;
    this.vy += GRAVITY; this.rot += this.rs;
    this.smokeTimer--;
    if (this.smokeTimer <= 0) {
      this.smokeTimer = 3;
      const tip = this.fuseTip();
      smokes.push(new SmokeParticle(tip.x, tip.y));
    }
    if (this.y > canvas.height + 60 && this.vy > 0) return false;
    return true;
  }
  explode() {
    this.exploding = true; this.explodeTimer = 20;
    shakeTimer = 15; shakeIntensity = 8;
    playExplosion();
    for (let j = 0; j < 25; j++) {
      const angle = (Math.PI * 2 / 25) * j;
      const speed = 3 + Math.random() * 5;
      particles.push(new ExplosionParticle(this.x, this.y, Math.cos(angle)*speed, Math.sin(angle)*speed));
    }
  }
  draw() {
    if (this.exploding) {
      const alpha = this.explodeTimer / 20;
      ctx.globalAlpha = alpha;
      ctx.fillStyle = '#ff4400';
      ctx.beginPath();
      ctx.arc(this.x, this.y, (20 - this.explodeTimer) * 8, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
      return;
    }
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rot);
    ctx.drawImage(bombImg, -this.size/2, -this.size/2, this.size, this.size);
    ctx.restore();
  }
}

class ExplosionParticle {
  constructor(x, y, vx, vy) {
    this.x = x; this.y = y; this.vx = vx; this.vy = vy;
    this.r = 3 + Math.random() * 5; this.life = 30; this.maxLife = 30;
    this.color = Math.random() > 0.5 ? '#ff4400' : '#ffaa00';
  }
  update() { this.x += this.vx; this.y += this.vy; this.vy += 0.15; return --this.life > 0; }
  draw() {
    ctx.globalAlpha = this.life / this.maxLife;
    ctx.fillStyle = this.color;
    ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  }
}

class Particle {
  constructor(x,y,dirX,dirY){ this.x=x; this.y=y;
    const speed=4+Math.random()*6;
    const angle=Math.atan2(dirY,dirX)+(Math.random()-.5)*.5;
    this.vx=Math.cos(angle)*speed; this.vy=Math.sin(angle)*speed;
    this.r=2+Math.random()*5; this.life=30+Math.floor(Math.random()*15); this.maxLife=this.life;
    this.color=BLOOD_COLORS[Math.floor(Math.random()*3)];
  }
  update(){ this.x+=this.vx; this.y+=this.vy; this.vy+=.25; this.vx*=.98; return --this.life>0; }
  draw(){ ctx.globalAlpha=this.life/this.maxLife; ctx.fillStyle=this.color;
    ctx.beginPath(); ctx.arc(this.x,this.y,this.r,0,Math.PI*2); ctx.fill(); ctx.globalAlpha=1; }
}

class Head {
  constructor(){
    this.x = Math.random() * (canvas.width * 0.7) + canvas.width * 0.15;
    this.y = canvas.height + 40;
    const centerX = canvas.width / 2;
    this.vx = (centerX - this.x) * 0.012 + (Math.random() - 0.5) * 1.5;
    this.vy = calcVy(50);
    this.face = randomFace();
    this.size = this.face.type === 'image' ? IMG_HEIGHT : HEAD_SIZE;
    this.rot = 0; this.rs = (Math.random() - 0.5) * 0.08;
    playLaunch();
  }
  update(){
    this.x += this.vx; this.y += this.vy;
    this.vy += GRAVITY; this.rot += this.rs;
    if(this.y > canvas.height + 60 && this.vy > 0){
      headsCleared++;
      if(gameMode===1){ lives--; updateUI(); if(lives<=0) endGame1P(); }
      return false;
    } return true;
  }
  draw(){ ctx.save(); ctx.translate(this.x,this.y); ctx.rotate(this.rot);
    if(this.face.type==='emoji'){ ctx.font=HEAD_SIZE+'px serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(this.face.value,0,0); }
    else{ const img=this.face.value; const w=img.drawW||IMG_HEIGHT; const h=img.drawH||IMG_HEIGHT; ctx.drawImage(img,-w/2,-h/2,w,h); }
    ctx.restore(); }
}

class Half {
  constructor(x,y,face,dir){ this.x=x; this.y=y; this.vx=dir*(Math.random()*2+2); this.vy=-2;
    this.face=face; this.size=face.type==='image'?IMG_HEIGHT:HEAD_SIZE;
    this.rot=0; this.rs=dir*.1; this.life=40; }
  update(){ this.x+=this.vx; this.y+=this.vy; this.vy+=.35; this.rot+=this.rs; return --this.life>0; }
  draw(){ const img=this.face.type==='image'?this.face.value:null;
    const w=img?(img.drawW||IMG_HEIGHT):HEAD_SIZE; const h=img?(img.drawH||IMG_HEIGHT):HEAD_SIZE;
    ctx.save(); ctx.translate(this.x,this.y); ctx.rotate(this.rot); ctx.globalAlpha=this.life/40;
    ctx.beginPath(); ctx.rect(-w/2,-h/2,w,h/2); ctx.clip();
    if(this.face.type==='emoji'){ ctx.font=HEAD_SIZE+'px serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(this.face.value,0,0); }
    else ctx.drawImage(img,-w/2,-h/2,w,h);
    ctx.restore(); }
}

function segIntersectsCircle(x1,y1,x2,y2,cx,cy,r){
  const dx=x2-x1,dy=y2-y1,fx=x1-cx,fy=y1-cy;
  const len2=dx*dx+dy*dy;
  if(len2===0) return fx*fx+fy*fy<=r*r;
  let t=-((fx*dx+fy*dy)/len2); t=Math.max(0,Math.min(1,t));
  const px=x1+t*dx-cx, py=y1+t*dy-cy;
  return px*px+py*py<=r*r;
}

function doSlice(x1,y1,x2,y2,player){
  const dx=x2-x1,dy=y2-y1;
  const dist=Math.sqrt(dx*dx+dy*dy);
  if(dist<MIN_SWIPE) return;
  const dirX=dx/dist, dirY=dy/dist;

  for(let i=bombs.length-1;i>=0;i--){
    const b=bombs[i];
    if(b.exploding) continue;
    if(segIntersectsCircle(x1,y1,x2,y2,b.x,b.y,b.size*0.4)){
      bombs.splice(i,1);
      b.explode(); bombs.push(b);
      if(gameMode===1){ lives--; updateUI(); if(lives<=0) endGame1P(); }
      else if(player===1){ score1=Math.max(0,score1-20); updateUI(); }
      else if(player===2){ score2=Math.max(0,score2-20); updateUI(); }
      return;
    }
  }

  for(let i=heads.length-1;i>=0;i--){
    const h=heads[i];
    const radius=h.size*.4;
    if(segIntersectsCircle(x1,y1,x2,y2,h.x,h.y,radius)){
      heads.splice(i,1);
      headsCleared++;
      playSlice();
      shakeTimer=8; shakeIntensity=4;

      if(gameMode===1){ score+=10; }
      else if(player===1){ score1+=10; }
      else if(player===2){ score2+=10; }
      updateUI();

      halves.push(new Half(h.x,h.y,h.face,-1));
      halves.push(new Half(h.x,h.y,h.face,1));
      for(let j=0;j<15;j++) particles.push(new Particle(h.x,h.y,dirX,dirY));
      for(let j=0;j<3;j++) stains.push(new Stain(h.x+(Math.random()-.5)*80, h.y+(Math.random()-.5)*80));
      registerCut(h.x, h.y, player);
    }
  }
}

function updateUI(){
  if(gameMode===1){
    document.getElementById('score').textContent=score;
    document.getElementById('lives').textContent=lives;
  } else {
    document.getElementById('score1').textContent=score1;
    document.getElementById('score2').textContent=score2;
    document.getElementById('timer').textContent=timeLeft;
  }
}

function endGame1P(){
  gameOver=true;
  document.getElementById('winnerText').textContent='';
  document.getElementById('goText').textContent='Pulsa para jugar otra vez';
  document.getElementById('gameover').style.display='block';
}

function resetToMenu(){
  gameStarted=false; gameOver=false;
  if(timerInterval) clearInterval(timerInterval);
  document.getElementById('gameover').style.display='none';
  document.getElementById('ui').style.display='none';
  document.getElementById('ui2p').style.display='none';
  document.getElementById('startScreen').style.display='flex';
}

let mouseDown=false;
canvas.addEventListener('mousedown',e=>{
  if(gameMode!==1||!gameStarted||gameOver) return;
  mouseDown=true; prevMouse={x:e.clientX,y:e.clientY};
});
canvas.addEventListener('mouseup',()=>{ mouseDown=false; trail1P=[]; prevMouse=null; });
canvas.addEventListener('mousemove',e=>{
  if(gameMode!==1||!mouseDown||gameOver||!gameStarted) return;
  const curr={x:e.clientX,y:e.clientY};
  trail1P.push(curr); if(trail1P.length>8) trail1P.shift();
  if(prevMouse){
    const d=Math.hypot(curr.x-prevMouse.x, curr.y-prevMouse.y);
    if(d>6) playSwoosh();
    doSlice(prevMouse.x,prevMouse.y,curr.x,curr.y,0);
  }
  prevMouse=curr;
});

canvas.addEventListener('touchstart',e=>{
  e.preventDefault();
  if(!gameStarted||gameOver) return;
  for(const t of e.changedTouches){
    if(gameMode===1){ prevMouse={x:t.clientX,y:t.clientY}; }
    else {
      let player=0;
      if(!playerAssign[0]){ player=1; playerAssign[0]=true; }
      else if(!playerAssign[1]){ player=2; playerAssign[1]=true; }
      if(player>0) activeTouches[t.identifier]={player,prevX:t.clientX,prevY:t.clientY};
    }
  }
},{passive:false});

canvas.addEventListener('touchmove',e=>{
  e.preventDefault();
  if(gameOver||!gameStarted) return;
  for(const t of e.changedTouches){
    if(gameMode===1){
      const curr={x:t.clientX,y:t.clientY};
      trail1P.push(curr); if(trail1P.length>8) trail1P.shift();
      if(prevMouse){
        const d=Math.hypot(curr.x-prevMouse.x, curr.y-prevMouse.y);
        if(d>6) playSwoosh();
        doSlice(prevMouse.x,prevMouse.y,curr.x,curr.y,0);
      }
      prevMouse=curr;
    } else {
      const info=activeTouches[t.identifier];
      if(info){
        const trail=info.player===1?trail1:trail2;
        trail.push({x:t.clientX,y:t.clientY});
        if(trail.length>10) trail.shift();
        const d=Math.hypot(t.clientX-info.prevX, t.clientY-info.prevY);
        if(d>6) playSwoosh();
        doSlice(info.prevX,info.prevY,t.clientX,t.clientY,info.player);
        info.prevX=t.clientX; info.prevY=t.clientY;
      }
    }
  }
},{passive:false});

canvas.addEventListener('touchend',e=>{
  e.preventDefault();
  for(const t of e.changedTouches){
    if(gameMode===1){ trail1P=[]; prevMouse=null; }
    else {
      const info=activeTouches[t.identifier];
      if(info){
        if(info.player===1) trail1=[]; else trail2=[];
        playerAssign[info.player-1]=false;
        delete activeTouches[t.identifier];
      }
    }
  }
},{passive:false});

document.getElementById('gameover').addEventListener('click',()=>{ if(gameOver) resetToMenu(); });
document.getElementById('gameover').addEventListener('touchend',e=>{ e.preventDefault(); if(gameOver) resetToMenu(); });
document.addEventListener('keydown',e=>{ if(e.code==='Space'&&gameOver) resetToMenu(); });

function drawTrail(trail, color) {
  if(trail.length<2) return;
  ctx.beginPath();
  ctx.moveTo(trail[0].x, trail[0].y);
  for(let i=1;i<trail.length;i++) ctx.lineTo(trail[i].x, trail[i].y);
  ctx.strokeStyle=color;
  ctx.lineWidth=4;
  ctx.lineCap='round';
  ctx.lineJoin='round';
  ctx.stroke();
}

function loop(){
  if(!gameStarted) return;
  ctx.clearRect(0,0,canvas.width,canvas.height);

  ctx.save();
  if(shakeTimer>0){ shakeTimer--;
    ctx.translate((Math.random()-.5)*shakeIntensity*2,(Math.random()-.5)*shakeIntensity*2);
    shakeIntensity*=.85;
  }

  if(!gameOver && gameMode===1){
    if(roundPause > 0){
      roundPause--;
      if(roundPause === 0) setupRound();
    } else if(roundActive) {
      const config = getRoundConfig(currentRound);

      if(attackQueue > 0){
        spawnTimer++;
        if(spawnTimer >= ATTACK_INTERVAL){ spawnTimer = 0; releaseAttackHead(); attackQueue--; headsSpawned++; }
      } else if(scriptQueue.length > 0){
        spawnTimer++;
        if(spawnTimer >= ATTACK_INTERVAL){
          spawnTimer = 0;
          const item = scriptQueue.shift();
          if(item === 'H'){ releaseAttackHead(); headsSpawned++; }
          else { bombs.push(new Bomb()); bombsSpawned++; }
        }
      } else if(pendingHeads.length>0){
        spawnTimer++;
        if(spawnTimer>=NEAR_INTERVAL){ spawnTimer=0; releaseHead(pendingHeads.shift()); headsSpawned++; }
      } else if(config.spawn==='seq' && !config.aligned && headsSpawned<headsInRound){
        spawnTimer++;
        const interval = Math.max(40, 80 - currentRound * 2);
        if(spawnTimer >= interval){ spawnTimer = 0; heads.push(new Head()); headsSpawned++; }
      }

      if(bombsInRound>0 && headsInRound===0 && bombsSpawned<bombsInRound && bombs.filter(b=>!b.exploding).length===0){
        bombs.push(new Bomb()); bombsSpawned++;
      }

      if(headsSpawned >= headsInRound && pendingHeads.length === 0 && attackQueue === 0 && scriptQueue.length === 0 && heads.length === 0 && bombsSpawned >= bombsInRound && bombs.filter(b=>!b.exploding).length === 0){
        roundActive = false;
        nextRound();
      }
    }
  } else if(!gameOver && gameMode===2){
    spawnTimer++;
    const interval=Math.max(30,70-difficulty*5);
    if(spawnTimer>=interval){ spawnTimer=0; if(heads.length<6) heads.push(new Head()); difficulty+=.05; }
    if(Math.random()<0.003 && bombs.filter(b=>!b.exploding).length===0){
      bombs.push(new Bomb());
    }
  }

  heads=heads.filter(h=>h.update());
  heads.forEach(h=>h.draw());
  halves=halves.filter(h=>h.update()); halves.forEach(h=>h.draw());
  bombs=bombs.filter(b=>b.update()); bombs.forEach(b=>b.draw());
  smokes=smokes.filter(s=>s.update()); smokes.forEach(s=>s.draw());
  particles=particles.filter(p=>p.update()); particles.forEach(p=>p.draw());
  stains=stains.filter(s=>s.update()); stains.forEach(s=>s.draw());
  comboTexts=comboTexts.filter(c=>c.update()); comboTexts.forEach(c=>c.draw());

  if(gameMode===1){
    drawTrail(trail1P,'rgba(255,255,255,0.6)');
  } else {
    drawTrail(trail1,'rgba(79,195,247,0.8)');
    drawTrail(trail2,'rgba(255,138,101,0.8)');
  }

  ctx.restore();
  requestAnimationFrame(loop);
}

updateUI();
</script>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Head Ninja 💀</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; background: #1a1a2e; cursor: crosshair; touch-action: none; }
  canvas { display: block; }
  #ui {
    position: absolute; top: 20px; left: 50%;
    transform: translateX(-50%);
    color: #fff; font-family: 'Arial Black', sans-serif;
    font-size: 24px; text-shadow: 2px 2px 4px #000;
    display: flex; gap: 40px;
  }
  #gameover {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%,-50%);
    color: #ff2222; font-family: 'Arial Black', sans-serif;
    font-size: 48px; text-shadow: 2px 2px 8px #000;
    display: none; text-align: center;
  }
  #gameover span { font-size: 20px; color: #fff; display: block; margin-top: 15px; }
  #startScreen {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: #1a1a2e;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    z-index: 100;
  }
  #startScreen h1 {
    color: #fff; font-family: 'Arial Black', sans-serif;
    font-size: 42px; margin-bottom: 40px;
    text-shadow: 2px 2px 8px #000;
    text-align: center;
  }
  #fullscreenBtn {
    padding: 20px 40px;
    font-size: 22px; font-family: 'Arial Black', sans-serif;
    background: #e63946; color: #fff;
    border: none; border-radius: 12px;
    cursor: pointer;
    transition: transform 0.2s, background 0.2s;
  }
  #fullscreenBtn:hover {
    background: #ff4d5a;
    transform: scale(1.1);
  }

  #rotateScreen {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: #1a1a2e;
    display: none;
    flex-direction: column;
    justify-content: center; align-items: center;
    z-index: 9999;
    color: #fff;
    font-family: 'Arial Black', sans-serif;
    font-size: 24px;
    text-align: center;
  }
  #rotateScreen .icon {
    font-size: 80px;
    animation: rotateAnim 1.5s ease-in-out infinite;
    margin-bottom: 20px;
  }
  @keyframes rotateAnim {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(90deg); }
  }

  @media screen and (orientation: portrait) {
    #rotateScreen { display: flex; }
    #startScreen, canvas, #ui, #gameover { display: none !important; }
  }
  @media screen and (orientation: landscape) {
    #rotateScreen { display: none; }
  }
</style>
</head>
<body>

<div id="rotateScreen">
  <div class="icon">📱</div>
  <div>GIRA EL DISPOSITIVO</div>
  <div style="font-size:16px; margin-top:10px; font-weight:normal;">
    Este juego se juega en horizontal
  </div>
</div>

<div id="startScreen">
  <h1>💀 HEAD NINJA 💀</h1>
  <button id="fullscreenBtn">🖥️ PANTALLA COMPLETA</button>
</div>

<div id="ui">
  <div>💀 <span id="score">0</span></div>
  <div>❤️ <span id="lives">3</span></div>
</div>
<div id="gameover">GAME OVER<span>Pulsa para jugar otra vez</span></div>
<canvas id="c"></canvas>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let gameStarted = false;
let heads = [], particles = [], halves = [], trail = [];
let score = 0, lives = 3, gameOver = false, spawnTimer = 0, difficulty = 1;
const GRAVITY = 0.22;
const HEAD_SIZE = 80;
const IMG_SIZE = 200;
const MIN_SWIPE = 15;

function lockLandscape() {
  if (screen.orientation && screen.orientation.lock) {
    screen.orientation.lock('landscape').catch(() => {});
  }
}

document.getElementById('fullscreenBtn').addEventListener('click', () => {
  const el = document.documentElement;
  const fs = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
  if (fs) {
    fs.call(el).then(() => {
      lockLandscape();
      startGame();
    }).catch(() => {
      lockLandscape();
      startGame();
    });
  } else {
    lockLandscape();
    startGame();
  }
});

function startGame() {
  document.getElementById('startScreen').style.display = 'none';
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  gameStarted = true;
  updateUI();
  loop();
}

window.addEventListener('resize', () => {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
});

window.addEventListener('orientationchange', () => {
  setTimeout(() => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }, 300);
});

const sliceSound = new Audio('chaf.ogg');

function playSlice() {
  const s = sliceSound.cloneNode();
  s.play();
}

const FACES = ['😄','😠','😱','🤪','😎','😈'];
const IMAGES = [];
const imgSrcs = [
  'manuel1.png', 'manuel2.png',
  'revestido1.png', 'revestido2.png',
  'jordi1.png', 'jordi2.png', 'jordi3.png',
  'lopez1.png', 'lopez2.png', 'lopez3.png',
  'garcia1.png'
];

imgSrcs.forEach(src => {
  const img = new Image();
  img.src = src;
  img.onload = function() {
    const aspect = this.naturalWidth / this.naturalHeight;
    if (aspect >= 1) {
      img.drawW = IMG_SIZE;
      img.drawH = IMG_SIZE / aspect;
    } else {
      img.drawH = IMG_SIZE;
      img.drawW = IMG_SIZE * aspect;
    }
  };
  IMAGES.push(img);
});

function randomFace() {
  const total = FACES.length + IMAGES.length;
  const idx = Math.floor(Math.random() * total);
  if (idx < FACES.length) return { type: 'emoji', value: FACES[idx] };
  return { type: 'image', value: IMAGES[idx - FACES.length] };
}

let prevMouse = null;

class Head {
  constructor() {
    this.x = Math.random() * (canvas.width - 100) + 50;
    this.y = canvas.height + 40;
    this.vx = (Math.random() - 0.5) * 3;
    const targetY = canvas.height * (0.1 + Math.random() * 0.25);
    const dist = (canvas.height + 40) - targetY;
    this.vy = -Math.sqrt(2 * GRAVITY * dist);
    this.face = randomFace();
    this.size = this.face.type === 'image' ? IMG_SIZE : HEAD_SIZE;
    this.rot = 0;
    this.rs = (Math.random() - 0.5) * 0.08;
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.vy += GRAVITY;
    this.rot += this.rs;
    if (this.y > canvas.height + 60 && this.vy > 0) {
      lives--;
      updateUI();
      if (lives <= 0) endGame();
      return false;
    }
    return true;
  }
  draw() {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rot);
    if (this.face.type === 'emoji') {
      ctx.font = HEAD_SIZE + 'px serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(this.face.value, 0, 0);
    } else {
      const img = this.face.value;
      const w = img.drawW || IMG_SIZE;
      const h = img.drawH || IMG_SIZE;
      ctx.drawImage(img, -w/2, -h/2, w, h);
    }
    ctx.restore();
  }
}

class Half {
  constructor(x, y, face, dir) {
    this.x = x; this.y = y;
    this.vx = dir * (Math.random() * 2 + 2);
    this.vy = -2;
    this.face = face;
    this.size = face.type === 'image' ? IMG_SIZE : HEAD_SIZE;
    this.rot = 0;
    this.rs = dir * 0.1;
    this.life = 40;
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.vy += 0.35;
    this.rot += this.rs;
    return --this.life > 0;
  }
  draw() {
    const img = this.face.type === 'image' ? this.face.value : null;
    const w = img ? (img.drawW || IMG_SIZE) : HEAD_SIZE;
    const h = img ? (img.drawH || IMG_SIZE) : HEAD_SIZE;
    const halfH = h / 2;

    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rot);
    ctx.globalAlpha = this.life / 40;
    ctx.beginPath();
    ctx.rect(-w/2, -halfH, w, halfH);
    ctx.clip();
    if (this.face.type === 'emoji') {
      ctx.font = HEAD_SIZE + 'px serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(this.face.value, 0, 0);
    } else {
      ctx.drawImage(img, -w/2, -halfH, w, h);
    }
    ctx.restore();
  }
}

class Particle {
  constructor(x, y) {
    this.x = x; this.y = y;
    this.vx = (Math.random() - 0.5) * 7;
    this.vy = (Math.random() - 0.5) * 7;
    this.r = Math.random() * 4 + 2;
    this.life = 25;
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.vy += 0.2;
    return --this.life > 0;
  }
  draw() {
    ctx.globalAlpha = this.life / 25;
    ctx.fillStyle = '#c00';
    ctx.fillRect(this.x - this.r, this.y - this.r, this.r * 2, this.r * 2);
    ctx.globalAlpha = 1;
  }
}

function segIntersectsCircle(x1, y1, x2, y2, cx, cy, r) {
  const dx = x2 - x1, dy = y2 - y1;
  const fx = x1 - cx, fy = y1 - cy;
  const len2 = dx * dx + dy * dy;
  if (len2 === 0) return (fx * fx + fy * fy) <= r * r;
  let t = -((fx * dx + fy * dy) / len2);
  t = Math.max(0, Math.min(1, t));
  const closestX = x1 + t * dx;
  const closestY = y1 + t * dy;
  const distX = closestX - cx, distY = closestY - cy;
  return (distX * distX + distY * distY) <= r * r;
}

function slice(x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1;
  const dist = Math.sqrt(dx * dx + dy * dy);
  if (dist < MIN_SWIPE) return;

  for (let i = heads.length - 1; i >= 0; i--) {
    const h = heads[i];
    const radius = h.size * 0.4;
    if (segIntersectsCircle(x1, y1, x2, y2, h.x, h.y, radius)) {
      heads.splice(i, 1);
      score += 10;
      updateUI();
      playSlice();
      halves.push(new Half(h.x, h.y, h.face, -1));
      halves.push(new Half(h.x, h.y, h.face, 1));
      for (let j = 0; j < 8; j++) particles.push(new Particle(h.x, h.y));
    }
  }
}

function updateUI() {
  document.getElementById('score').textContent = score;
  document.getElementById('lives').textContent = lives;
}

function endGame() {
  gameOver = true;
  document.getElementById('gameover').style.display = 'block';
}

function reset() {
  heads = []; particles = []; halves = []; trail = [];
  score = 0; lives = 3; difficulty = 1; gameOver = false; spawnTimer = 0;
  prevMouse = null;
  document.getElementById('gameover').style.display = 'none';
  updateUI();
}

// Mouse
let mouseDown = false;
canvas.addEventListener('mousedown', e => {
  mouseDown = true;
  prevMouse = { x: e.clientX, y: e.clientY };
});
canvas.addEventListener('mouseup', () => { mouseDown = false; trail = []; prevMouse = null; });
canvas.addEventListener('mousemove', e => {
  if (!mouseDown || gameOver || !gameStarted) return;
  const curr = { x: e.clientX, y: e.clientY };
  trail.push(curr);
  if (trail.length > 8) trail.shift();
  if (prevMouse) {
    slice(prevMouse.x, prevMouse.y, curr.x, curr.y);
  }
  prevMouse = curr;
});

// Touch
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  if (!gameStarted || gameOver) return;
  const t = e.touches[0];
  prevMouse = { x: t.clientX, y: t.clientY };
}, { passive: false });

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (gameOver || !gameStarted) return;
  const t = e.touches[0];
  const curr = { x: t.clientX, y: t.clientY };
  trail.push(curr);
  if (trail.length > 8) trail.shift();
  if (prevMouse) {
    slice(prevMouse.x, prevMouse.y, curr.x, curr.y);
  }
  prevMouse = curr;
}, { passive: false });

canvas.addEventListener('touchend', e => {
  e.preventDefault();
  trail = [];
  prevMouse = null;
}, { passive: false });

// Reiniciar
document.getElementById('gameover').addEventListener('click', () => {
  if (gameOver) reset();
});
document.getElementById('gameover').addEventListener('touchend', e => {
  e.preventDefault();
  if (gameOver) reset();
});

document.addEventListener('keydown', e => {
  if (e.code === 'Space' && gameOver) reset();
});

function loop() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (!gameOver) {
    spawnTimer++;
    const interval = Math.max(30, 70 - difficulty * 5);
    if (spawnTimer >= interval) {
      spawnTimer = 0;
      if (heads.length < 6) heads.push(new Head());
      difficulty += 0.05;
    }
    heads = heads.filter(h => h.update());
  }

  heads.forEach(h => h.draw());
  halves = halves.filter(h => h.update());
  halves.forEach(h => h.draw());
  particles = particles.filter(p => p.update());
  particles.forEach(p => p.draw());

  if (trail.length > 1) {
    ctx.beginPath();
    ctx.moveTo(trail[0].x, trail[0].y);
    for (let i = 1; i < trail.length; i++) ctx.lineTo(trail[i].x, trail[i].y);
    ctx.strokeStyle = 'rgba(255,255,255,0.6)';
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.stroke();
  }

  requestAnimationFrame(loop);
}

updateUI();
</script>
</body>
</html>
